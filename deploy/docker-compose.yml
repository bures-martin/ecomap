# Production: one community on one server.
#
#   cp deploy/.env.example deploy/.env    # then fill it in
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
#
# Step by step, including the first seed and backups: docs/deploy.md.

# Its own project name, so it never touches the development database (project "ecomap").
name: ecomap-production

services:
  db:
    image: postgis/postgis:17-3.5
    restart: unless-stopped
    environment:
      POSTGRES_USER: ecomap
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: ecomap
    # No published port: only the API and the backup job can reach it.
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ecomap -d ecomap']
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgres://ecomap:${POSTGRES_PASSWORD}@db:5432/ecomap
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in deploy/.env}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://${DOMAIN}}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-15m}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-30}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:?Set SEED_ADMIN_EMAIL in deploy/.env}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?Set SEED_ADMIN_PASSWORD in deploy/.env}
      SEED_ADMIN_NAME: ${SEED_ADMIN_NAME:-Admin}
      COMMUNITY: ${COMMUNITY:-neutral}
      # Links in e-mails (sign-up confirmation, password reset) point here.
      PUBLIC_URL: https://${DOMAIN}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-EcoMap <no-reply@${DOMAIN}>}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    # Server logs (with IP addresses) are rotated by size - five files of 20 MB,
    # roughly a few weeks on a small community map. The privacy page says how long.
    logging:
      driver: json-file
      options:
        max-size: '20m'
        max-file: '5'

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in deploy/.env}
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
      - '${HTTPS_PORT:-443}:443/udp'
    volumes:
      # Certificates live here; keep this volume, or Let's Encrypt limits may bite.
      - caddy-data:/data
      - caddy-config:/config

  backup:
    image: postgis/postgis:17-3.5
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: ecomap
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ecomap
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_HOUR: ${BACKUP_HOUR:-3}
    volumes:
      - ./backups:/backups
      - ./backup.sh:/backup.sh:ro
      - ./restore-check.sh:/restore-check.sh:ro
    entrypoint: ['sh', '/backup.sh']

volumes:
  db-data:
  caddy-data:
  caddy-config:
